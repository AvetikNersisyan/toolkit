# nginx site for toolkit.am — reverse proxy to the Next.js app on 127.0.0.1:3000.
# Cloudflare sits in front (orange cloud); this origin uses a Cloudflare Origin
# Certificate and should be set to SSL mode "Full (strict)" in Cloudflare.
#
# Install:
#   sudo cp deploy/nginx/toolkit.am.conf          /etc/nginx/sites-available/toolkit.am
#   sudo cp deploy/nginx/cloudflare-realip.conf   /etc/nginx/conf.d/cloudflare-realip.conf
#   sudo ln -s /etc/nginx/sites-available/toolkit.am /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name toolkit.am www.toolkit.am;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name toolkit.am www.toolkit.am;

    # Cloudflare Origin Certificate (created in Cloudflare → SSL/TLS → Origin Server).
    ssl_certificate     /etc/ssl/cloudflare/toolkit.am.pem;
    ssl_certificate_key /etc/ssl/cloudflare/toolkit.am.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Send www → apex (optional; adjust if you prefer www as canonical).
    if ($host = www.toolkit.am) {
        return 301 https://toolkit.am$request_uri;
    }

    client_max_body_size 2m;

    # Let Next.js serve its own hashed, immutable assets with long caching.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
